CONFIG_NRF5340_AUDIO_CS47L63_DRIVER=y
CONFIG_TRANSPORT_BIS=y
CONFIG_AUDIO_SOURCE_I2S=y
CONFIG_BT_AUDIO_BROADCAST_NAME="TAMAUDIO"
CONFIG_AUDIO_TEST_TONE=y

CONFIG_BT_BAP_BROADCAST_16_2_1=y

# LE Audio retransmits (RTN). Preset 16_2_1 defaults to 2 (=3 tx per SDU);
# broadcast_source.c applies this Kconfig over the preset. Reduced to 1 to cut
# BIG subevents (2 BIS x (1+RTN)) and free radio time for the connectionless
# PPG beacon (was ~65 Hz of 100 due to ISO contention). Stereo + 16 kHz/32 kbps
# audio unchanged; trade-off is less retransmit robustness at range.
CONFIG_BT_AUDIO_RETRANSMITS=1

# TAM board has no physical UART and USB D+/D- are not routed to the nRF5340.
# Use RTT via J-Link for console, logs, and shell (prj.conf enables these).
CONFIG_USB_CDC_ACM=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER=0
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=512
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_PRINTK=y
CONFIG_FAULT_DUMP=2

# No 32.768 kHz crystal is fitted; the LF clock runs from the internal RC
# (CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC in the board defconfig). Leaving the
# LFXO pin function enabled makes soc.c hand XL1/XL2 to the oscillator via
# nrf_gpio_pin_control_select(), which takes P0.00 and P0.01 away from the
# GPIO block entirely: reads return 0 and pull configuration is ignored.
# P0.00 is SW1 (net SWITCH) and P0.01 is the CS47L63 GPIO9, so both need
# the pins back.
CONFIG_SOC_ENABLE_LFXO=n
